<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Dashboard | OmniHubb</title><link rel="stylesheet" href="style.css"></head><body><div id="site-header"></div><main><section class="page-hero"><div class="container"><span class="eyebrow" style="color:#c4b5fd">DEVELOPMENT CONTROL CENTER</span><h1>OmniHubb Admin</h1><p>Manage the first layer of OmniHubb data through the local API. Authentication and production permissions come later.</p></div></section><section class="section container"><div class="admin-grid" id="admin-stats"></div><div class="admin-card" style="margin-top:24px"><span class="eyebrow">ADD AFFILIATE DEAL</span><h2 style="margin:8px 0 16px">Create a deal</h2><form id="deal-form" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px"><input name="id" required placeholder="ID e.g. samsung-s25"><input name="name" required placeholder="Product name"><input name="price" required type="number" placeholder="Price"><input name="old" type="number" placeholder="Original price"><input name="discount" type="number" placeholder="Discount %"><input name="rating" type="number" step="0.1" placeholder="Rating"><input name="category" placeholder="Category"><input name="store" placeholder="Store / Affiliate"><input name="image" placeholder="Image path e.g. Image/product.jpg"><input name="page" placeholder="Product page e.g. products/samsung.html"><button class="btn btn-primary" type="submit" style="grid-column:1/-1">Add Deal</button></form><p id="deal-form-msg" style="margin-top:12px"></p></div></section></main><div id="site-footer"></div><script src="script.js"></script><script>
async function loadAdmin(){const box=document.getElementById('admin-stats');try{const r=await fetch('/api/admin/stats');if(!r.ok)throw new Error();const s=await r.json();box.innerHTML=[['LIVE DEALS',s.deals,'Affiliate offers'],['GIFT CARDS',s.giftCards,'Brands & denominations'],['BUSINESSES',s.businesses,'Local partners'],['ORDERS',s.orders,'Ready for checkout integration'],['USERS',s.users,'Ready for authentication'],['CAMPAIGNS',s.campaigns,'Ready for advertising']].map(x=>`<div class="admin-card"><span class="eyebrow">${x[0]}</span><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('');}catch(e){box.innerHTML='<div class="empty-state" style="grid-column:1/-1">Start the OmniHubb Node server to load live admin data.</div>'}}
loadAdmin();
document.getElementById('deal-form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const item=Object.fromEntries(f.entries());item.price=Number(item.price);if(item.old)item.old=Number(item.old);if(item.discount)item.discount=Number(item.discount);if(item.rating)item.rating=Number(item.rating);try{const r=await fetch('/api/admin/deals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not add deal');document.getElementById('deal-form-msg').textContent='Deal added successfully. Refresh the deals page to see it.';e.target.reset();loadAdmin()}catch(err){document.getElementById('deal-form-msg').textContent=err.message}});
</script></body></html>
